name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server

      # Without ui/dist/public the server builds with an empty UI list and shows a notice
      # instead of the interface; the API tests don't need it.
      - name: Test
        run: cargo test --locked

  ui:
    name: Web UI (wasm32 check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ui
          workspaces: ui -> target

      # assets/tailwind.css is generated by `dx` (and git-ignored), but `asset!` needs the file
      # to exist at compile time; an empty one is enough for type checking.
      - name: Check
        working-directory: ui
        run: |
          test -f assets/tailwind.css || touch assets/tailwind.css
          cargo check --locked --target wasm32-unknown-unknown
