name: Release

# Runs when a GitHub release is published (or by hand for an existing tag):
# - pushes the multi-arch image ghcr.io/<owner>/nrz-news:<version> (+ :latest)
# - attaches the program for linux amd64 and arm64 plus SHA256SUMS to the release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version and image name
        id: v
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nrz-news" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Rust is cross-compiled on the runner; only the few RUN steps of the arm64 runtime
      # stage (apt-get, useradd) need emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Program (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nrznews.containerbuild
          target: binaries
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          for arch in amd64 arm64; do
            cp "dist/linux_$arch/nrznews" "nrznews-$v-linux-$arch"
            chmod +x "nrznews-$v-linux-$arch"
          done
          sha256sum nrznews-$v-linux-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" nrznews-$v-linux-* SHA256SUMS --clobber

      - name: Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nrznews.containerbuild
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=nrzNews
            org.opencontainers.image.description=Self-hosted multi-user RSS reader written in Rust
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.v.outputs.revision }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            index:org.opencontainers.image.description=Self-hosted multi-user RSS reader written in Rust
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest for the Umbrel store
        run: |
          docker buildx imagetools inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" \
            --format '{{ .Manifest.Digest }}' | tee digest.txt
          echo "Image: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}@$(cat digest.txt)" >> "$GITHUB_STEP_SUMMARY"
